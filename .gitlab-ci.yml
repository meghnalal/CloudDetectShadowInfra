image: alpine:3.18

stages:
  - validate
  - plan
  - apply
  - destroy
  - drift-detection

variables:
  TF_ROOT: "./terraform/"
  TF_IN_AUTOMATION: "true"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .terraform/

# if in main the file
# before_script:
#   - apk add --no-cache curl unzip bash jq python3 py3-pip
#   - curl -fsSL https://releases.hashicorp.com/terraform/1.9.3/terraform_1.9.3_linux_amd64.zip -o terraform.zip
#   - unzip terraform.zip && mv terraform /usr/local/bin/ && rm terraform.zip
#   - terraform -version

# if you have tf folder
before_script:
  - apk add --no-cache curl unzip bash jq python3 py3-pip
  - curl -fsSL https://releases.hashicorp.com/terraform/1.9.3/terraform_1.9.3_linux_amd64.zip -o /tmp/terraform.zip
  - unzip /tmp/terraform.zip -d /tmp && mv /tmp/terraform /usr/local/bin/terraform
  - chmod +x /usr/local/bin/terraform
  - rm /tmp/terraform.zip
  - export PATH=$PATH:/usr/local/bin
  - terraform -version

validate:
  stage: validate
  script:
    - cd $TF_ROOT
    - terraform init -backend=false
    - terraform fmt
    - terraform validate

plan:
  stage: plan
  script:
    - cd $TF_ROOT
    - terraform init
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - $TF_ROOT/tfplan
    expire_in: 1 hour

apply:
  stage: apply
  script:
    - cd $TF_ROOT
    - terraform init
    - terraform apply -auto-approve tfplan
  dependencies:
    - plan
  when: manual

destroy:
  stage: destroy
  script:
    - cd $TF_ROOT
    - terraform init
    - terraform destroy -auto-approve
  dependencies:
    - plan
  when: manual

drift_check:
  stage: drift-detection
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python src/main.py
  artifacts:
    paths:
      - report.json
    expire_in: 7 days
  when: manual